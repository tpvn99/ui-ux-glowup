name: Benchmark

# Ten projects, known seeded defects, injected regressions. Fails when recall, regressions caught or
# false positives get worse than benchmark/baseline.json. Weekly, on demand, and on pull requests that
# touch what it measures. Takes about 20 minutes and needs network (the examples load CDNs).

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "skills/ui-ux-glowup/scripts/**"
      - "skills/ui-ux-glowup/assets/examples/**"
      - "benchmark/**"

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the benchmark against the baseline
        run: node benchmark/run.mjs --check
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark/RESULTS.md
            benchmark/results.json
