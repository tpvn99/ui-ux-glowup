<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollis Plumbing — emergency plumber in Leeds</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; color: #18181b; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #d4d4d8; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; }
  h1 { font-size: 48px; line-height: 1.1; margin: 24px 0; }
  .grad { background: linear-gradient(90deg, #f97316, #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 48px; }
  .accent { border-left: 4px solid #6366f1; padding: 16px 20px; background: #fafafa; }
  .glow { padding: 24px; border: 1px solid #e4e4e7; border-radius: 8px; box-shadow: 0 0 40px rgba(99, 102, 241, .5); }
  .tiles { display: flex; gap: 16px; margin-top: 48px; }
  .tile { width: 48px; height: 48px; border-radius: 12px; background: #e0e7ff; display: grid; place-items: center; }
</style>
</head>
<body>
<main>
  <span class="pill"><span class="dot"></span>Now taking bookings</span>
  <h1>Fast boiler repairs, <span class="grad">same day</span> across Leeds</h1>
  <p>Fixed prices, written quotes and a twelve-month guarantee on every repair we carry out.</p>
  <div class="row">
    <div class="accent">Every engineer is Gas Safe registered and carries a photo ID card.</div>
    <div class="glow">Call before 2 pm and we are on site the same afternoon, six days a week.</div>
  </div>
  <div class="tiles">
    <div class="tile"><svg width="24" height="24"><circle cx="12" cy="12" r="10"/></svg></div>
    <div class="tile"><svg width="24" height="24"><circle cx="12" cy="12" r="10"/></svg></div>
    <div class="tile"><svg width="24" height="24"><circle cx="12" cy="12" r="10"/></svg></div>
  </div>
</main>
</body>
</html>
